<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05040a">
  <title>Kaizo Roaring Knight</title>
  <style>
    :root { color-scheme: dark; background: #05040a; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 0%, #1b1030 0%, transparent 62%),
        #05040a;
    }
    body {
      display: grid;
      place-items: center;
    }
    #game {
      display: block;
      width: min(100vw, 177.777778vh);
      height: min(100vh, 56.25vw);
      border: 0;
      background: #05040a;
    }
    @supports (height: 100dvh) {
      #game {
        width: min(100vw, 177.777778dvh);
        height: min(100dvh, 56.25vw);
      }
    }
    #sourceLink {
      position: fixed;
      z-index: 5;
      top: max(10px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      padding: 8px 11px;
      border: 1px solid #63577e;
      border-radius: 5px;
      background: #100c1cdd;
      color: #e9e2ff;
      font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .06em;
      text-decoration: none;
      backdrop-filter: blur(8px);
    }
    #sourceLink:hover { border-color: #b59bff; background: #211832ee; }
    #rotateHint {
      display: none;
      position: fixed;
      z-index: 4;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 12px;
      right: 12px;
      text-align: center;
      color: #a9a2c4;
      font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      pointer-events: none;
    }
    @media (orientation: portrait) {
      #rotateHint { display: block; }
    }
  </style>
</head>
<body>
  <iframe
    id="game"
    src="https://amirouanother.github.io/DEVICE-Kaizo-Knight/game.html"
    title="DEVICE — Kaizo Roaring Knight"
    allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
  <a id="sourceLink"
     href="https://amirouanother.github.io/DEVICE-Kaizo-Knight/game.html"
     target="_blank"
     rel="noopener noreferrer">OPEN ORIGINAL</a>
  <div id="rotateHint">Landscape orientation gives the game its intended 16:9 play area.</div>
</body>
</html>
